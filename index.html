<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NANCI // 幻灵</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0a0a0a;
  color:#e0e0e0;
  font-family:"SF Mono",Menlo,Consolas,monospace;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow-x:hidden;
  position:relative;
}
/* 背景网格 */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(255,0,60,0.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,0,60,0.06) 1px,transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
  z-index:0;
}
/* 扫描线 */
body::after{
  content:"";
  position:fixed;
  inset:0;
  background:repeating-linear-gradient(
    0deg,
    rgba(0,0,0,0) 0px,
    rgba(0,0,0,0) 2px,
    rgba(0,0,0,0.15) 3px,
    rgba(0,0,0,0) 4px
  );
  pointer-events:none;
  z-index:1;
}
.wrap{
  position:relative;
  z-index:2;
  width:100%;
  max-width:720px;
  padding:40px 24px;
}
.tag{
  display:inline-block;
  font-size:12px;
  letter-spacing:4px;
  color:#ff003c;
  border:1px solid #ff003c;
  padding:4px 10px;
  margin-bottom:24px;
  text-transform:uppercase;
}
h1{
  font-size:clamp(36px,9vw,72px);
  font-weight:900;
  line-height:1.05;
  letter-spacing:-2px;
  color:#fff;
  margin-bottom:8px;
}
h1 span{
  color:#ff003c;
  text-shadow:0 0 20px rgba(255,0,60,0.8);
}
.sub{
  font-size:14px;
  color:#666;
  margin-bottom:40px;
  letter-spacing:1px;
}
.sub b{
  color:#e0e0e0;
}
.links{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}
@media(min-width:520px){
  .links{grid-template-columns:1fr 1fr}
}
.link{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 20px;
  background:rgba(255,255,255,0.02);
  border:1px solid #1a1a1a;
  text-decoration:none;
  color:#e0e0e0;
  transition:all 0.2s;
  position:relative;
  overflow:hidden;
}
.link::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:3px;
  background:#ff003c;
  transform:scaleY(0);
  transition:transform 0.2s;
}
.link:hover{
  border-color:#ff003c;
  background:rgba(255,0,60,0.05);
  transform:translateX(4px);
}
.link:hover::before{
  transform:scaleY(1);
}
.link .name{
  font-size:15px;
  font-weight:700;
}
.link .arrow{
  color:#ff003c;
  font-size:18px;
  transition:transform 0.2s;
}
.link:hover .arrow{
  transform:translateX(4px);
}
.footer{
  margin-top:48px;
  padding-top:24px;
  border-top:1px dashed #1a1a1a;
  font-size:12px;
  color:#444;
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
}
.footer .dot{
  color:#ff003c;
}
</style>
</head>
<body>
<div class="wrap">

  <div class="tag">// SYSTEM ONLINE</div>

  <h1>NANCI<br><span>幻灵终端</span></h1>
  <p class="sub">开发者 · <b>南辞</b> · 玩机 / 开源 / 折腾</p>

  <div class="links">
    <a class="link" href="https://github.com/nanci-dev" target="_blank">
      <span class="name">GitHub</span>
      <span class="arrow">→</span>
    </a>
    <a class="link" href="https://github.com/nanci-dev/LiteMask" target="_blank">
      <span class="name">LiteMask 开源项目</span>
      <span class="arrow">→</span>
    </a>
    <a class="link" href="https://github.com/nanci-dev/LiteMask/releases" target="_blank">
      <span class="name">下载 Release</span>
      <span class="arrow">→</span>
    </a>
    <a class="link" href="mailto:3932194646@qq.com">
      <span class="name">联系我</span>
      <span class="arrow">→</span>
    </a>
  </div>

  <div class="footer">
    <span><span class="dot">●</span> 科技不再是高高在上，而是服务于人民</span>
    <span>© 2026 NANCI</span>
  </div>

</div>
</body>
</html>
